<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERRO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    #matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      opacity: 0.72;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.22) 46%, rgba(255,255,255,0.02) 100%);
    }

    .error {
      position: relative;
      color: #ff0000;
      font-size: clamp(6rem, 22vw, 22rem);
      font-weight: 1000;
      letter-spacing: 0.04em;
      line-height: 0.85;
      text-transform: uppercase;
      text-align: center;
      text-shadow:
        0 0 8px rgba(255, 0, 0, 0.8),
        0 0 22px rgba(255, 0, 0, 0.45),
        8px 0 0 rgba(0, 255, 65, 0.24),
        -8px 0 0 rgba(0, 0, 0, 0.16);
      animation: pulse 1.3s infinite alternate, glitch 2.4s infinite;
    }

    .error::before,
    .error::after {
      content: "ERRO";
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0.32;
    }

    .error::before {
      color: #00ff41;
      transform: translate(7px, -2px);
      clip-path: inset(12% 0 55% 0);
      animation: glitchTop 1.6s infinite steps(2, end);
    }

    .error::after {
      color: #111111;
      transform: translate(-7px, 2px);
      clip-path: inset(58% 0 12% 0);
      animation: glitchBottom 1.9s infinite steps(2, end);
    }

    .subtitle {
      position: absolute;
      top: calc(50% + clamp(5rem, 12vw, 10rem));
      color: #111;
      font-family: "Courier New", monospace;
      font-size: clamp(0.8rem, 1.5vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.78);
      padding: 0.65rem 1rem;
      border: 1px solid rgba(0, 255, 65, 0.35);
      box-shadow: 0 0 18px rgba(0,255,65,0.14);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.13;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(0, 0, 0, 0.12) 4px
      );
      animation: scan 8s linear infinite;
    }

    @keyframes pulse {
      from { transform: scale(0.985); filter: brightness(0.95); }
      to   { transform: scale(1.025); filter: brightness(1.18); }
    }

    @keyframes glitch {
      0%, 88%, 100% { transform: translate(0) skew(0deg); }
      90% { transform: translate(-4px, 2px) skew(-1deg); }
      92% { transform: translate(5px, -2px) skew(1deg); }
      94% { transform: translate(-2px, 1px) skew(0deg); }
    }

    @keyframes glitchTop {
      0%, 70%, 100% { transform: translate(7px, -2px); }
      72% { transform: translate(-12px, 1px); }
      74% { transform: translate(10px, -4px); }
    }

    @keyframes glitchBottom {
      0%, 75%, 100% { transform: translate(-7px, 2px); }
      77% { transform: translate(13px, -1px); }
      79% { transform: translate(-10px, 4px); }
    }

    @keyframes scan {
      from { transform: translateY(-8px); }
      to { transform: translateY(8px); }
    }
  </style>
</head>

<body>
  <canvas id="matrix"></canvas>

  <main class="overlay">
    <div class="error">ERRO</div>
    <div class="subtitle">Falha crítica no sistema</div>
  </main>

  <div class="scanlines"></div>

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    const characters =
      "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@!?<>[]{}ΞΨΩЖЯアカサタナハマヤラワ";

    let fontSize = 17;
    let columns = 0;
    let drops = [];

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      columns = Math.floor(window.innerWidth / fontSize);
      drops = Array.from({ length: columns }, () =>
        Math.random() * -(window.innerHeight / fontSize)
      );
    }

    function drawMatrix() {
      ctx.fillStyle = "rgba(255, 255, 255, 0.10)";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      ctx.font = `bold ${fontSize}px monospace`;

      for (let i = 0; i < drops.length; i++) {
        const char = characters[Math.floor(Math.random() * characters.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.shadowColor = "#00ff41";
        ctx.shadowBlur = 7;
        ctx.fillStyle = Math.random() > 0.96 ? "#b6ffca" : "#00c936";
        ctx.fillText(char, x, y);

        ctx.shadowBlur = 0;

        if (y > window.innerHeight && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i] += 0.75 + Math.random() * 0.35;
      }

      requestAnimationFrame(drawMatrix);
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();
    drawMatrix();
  </script>
</body>
</html>
