<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fina Estampa</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #c9a84c;
  --gold-light: #f0d080;
  --gold-dim: #7a6228;
  --gold-glow: rgba(201,168,76,0.35);
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(201,168,76,0.22);
  --glass-border-hover: rgba(201,168,76,0.6);
  --text: #f0ead8;
  --text-muted: rgba(240,234,216,0.5);
}

html { background: #050505; }

body {
  min-height: 100svh;
  background: transparent;
  color: var(--text);
  font-family: 'Raleway', sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

/* BG */
.bg-scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

#bgCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.bg-overlay {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 55% at 50% -5%, rgba(201,168,76,0.13) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 15% 85%, rgba(201,168,76,0.06) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 85% 55%, rgba(120,80,20,0.07) 0%, transparent 55%),
    linear-gradient(180deg, rgba(5,5,5,0.25) 0%, rgba(5,5,5,0.7) 50%, rgba(5,5,5,0.96) 100%);
}

/* WRAPPER */
.wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 460px;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 64px 22px 56px;
}

/* AVATAR */
.avatar-wrap {
  position: relative;
  margin-bottom: 24px;
  opacity: 0;
  animation: fadeDown 0.9s 0.1s cubic-bezier(.22,1,.36,1) forwards;
}


/* LOGO BASE64 */
.logo-wrap {
  width: 176px;
  height: 184px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  align-self: center;
  isolation: isolate;
}

.logo-wrap::before {
  content: none;
  display: none;
}

.logo-wrap::after {
  content: '';
  position: absolute;
  inset: 7px 0 0;
  border-radius: 50%;
  background: linear-gradient(110deg, transparent 16%, rgba(255,255,255,0.12) 48%, transparent 70%);
  transform: translateX(-115%) skewX(-14deg);
  mix-blend-mode: screen;
  opacity: .7;
  z-index: 3;
  pointer-events: none;
  animation: logoShine 4.2s cubic-bezier(.55,.08,.25,1) infinite;
}

.logo-glow {
  display: none;
}

.brand-logo {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  background: transparent;
  user-select: none;
  -webkit-user-drag: none;
  filter: none;
  animation: logoFloat 4.6s ease-in-out infinite;
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0) scale(1); }
  50%      { transform: translateY(-4px) scale(1.018); }
}

@keyframes logoAura {
  0%, 100% { opacity: .62; transform: scale(.96); }
  50%      { opacity: 1; transform: scale(1.04); }
}

@keyframes logoPulse {
  0%, 100% { opacity: .62; transform: scale(.98); }
  50%      { opacity: 1; transform: scale(1.04); }
}

@keyframes logoShine {
  0%   { transform: translateX(-130%) skewX(-14deg); opacity: 0; }
  15%  { opacity: .75; }
  52%  { opacity: .45; }
  82%  { transform: translateX(130%) skewX(-14deg); opacity: 0; }
  100% { transform: translateX(130%) skewX(-14deg); opacity: 0; }
}

.avatar-spin-ring {
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    transparent 0%, rgba(201,168,76,0.0) 10%,
    rgba(201,168,76,0.7) 25%, rgba(240,208,128,1) 40%,
    rgba(201,168,76,0.7) 55%, rgba(201,168,76,0.0) 70%,
    transparent 80%
  );
  animation: spinRing 3.5s linear infinite;
  filter: blur(2.5px);
  opacity: 0.75;
}

.avatar-spin-ring::after {
  content: '';
  position: absolute;
  inset: 8px;
  border-radius: 50%;
  background: #050505;
}

@keyframes spinRing { to { transform: rotate(360deg); } }

.avatar-circle {
  position: relative;
  z-index: 1;
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #1e1a10, #080705);
  border: 1.5px solid rgba(201,168,76,0.38);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 0 0 1px rgba(201,168,76,0.08),
    inset 0 1px 0 rgba(240,208,128,0.13),
    inset 0 -1px 0 rgba(0,0,0,0.6);
}

.avatar-letter {
  font-family: 'Cormorant Garamond', serif;
  font-size: 46px;
  font-weight: 700;
  background: linear-gradient(155deg, #f5e8c0 0%, #c9a84c 55%, #8a6420 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-top: 4px;
}

.crown {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  filter: drop-shadow(0 2px 8px rgba(201,168,76,0.55));
}

.crown svg { width: 34px; height: 22px; }

/* NAME */
.brand-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 33px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-align: center;
  background: linear-gradient(155deg, #f8efd4 0%, #c9a84c 55%, #9a7228 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
  opacity: 0;
  animation: fadeDown 0.9s 0.18s cubic-bezier(.22,1,.36,1) forwards;
}

.brand-sub {
  font-size: 10.5px;
  font-weight: 400;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 38px;
  opacity: 0;
  animation: fadeDown 0.9s 0.26s cubic-bezier(.22,1,.36,1) forwards;
}

/* DIVIDER */
.gold-line {
  width: 100%;
  height: 1px;
  margin-bottom: 34px;
  background: linear-gradient(90deg,
    transparent 0%, rgba(201,168,76,0.06) 8%,
    rgba(201,168,76,0.35) 38%, rgba(240,208,128,0.55) 50%,
    rgba(201,168,76,0.35) 62%, rgba(201,168,76,0.06) 92%,
    transparent 100%
  );
  opacity: 0;
  animation: fadeIn 0.8s 0.32s ease forwards;
}

/* LINKS */
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 13px;
}

.link-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 56px;
  padding: 17px 28px;
  border-radius: 60px;
  text-decoration: none;
  color: var(--text);
  font-family: 'Raleway', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  overflow: hidden;
  isolation: isolate;
  opacity: 0;
  transform: translateZ(0);
  clip-path: inset(0 round 60px);
  -webkit-clip-path: inset(0 round 60px);
  -webkit-mask-image: -webkit-radial-gradient(white, black);
  will-change: transform;
  transition: transform 0.28s cubic-bezier(.22,1,.36,1), color 0.25s;
  -webkit-tap-highlight-color: transparent;
}

.link-btn:nth-child(1) { animation: fadeUp 0.75s 0.38s cubic-bezier(.22,1,.36,1) forwards, glassFloat 4.2s 1.15s ease-in-out infinite; }
.link-btn:nth-child(2) { animation: fadeUp 0.75s 0.48s cubic-bezier(.22,1,.36,1) forwards, glassFloat 4.2s 1.28s ease-in-out infinite; }
.link-btn:nth-child(3) { animation: fadeUp 0.75s 0.58s cubic-bezier(.22,1,.36,1) forwards, glassFloat 4.2s 1.41s ease-in-out infinite; }
.link-btn:nth-child(4) { animation: fadeUp 0.75s 0.68s cubic-bezier(.22,1,.36,1) forwards, glassFloat 4.2s 1.54s ease-in-out infinite; }

/* glassmorphism base infinito */
.link-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 60px;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.105) 0%, rgba(255,255,255,0.035) 44%, rgba(201,168,76,0.07) 100%),
    rgba(255,255,255,0.038);
  backdrop-filter: blur(18px) saturate(1.45);
  -webkit-backdrop-filter: blur(18px) saturate(1.45);
  border: 1px solid rgba(240,208,128,0.34);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(0,0,0,0.16);
  clip-path: inset(0 round 60px);
  -webkit-clip-path: inset(0 round 60px);
  animation: glassBreath 3.6s ease-in-out infinite;
  transition: border-color 0.35s, background 0.35s;
  z-index: 0;
}

/* reflexo de vidro infinito */
.link-btn::after {
  content: '';
  position: absolute;
  inset: 1px;
  border-radius: 60px;
  pointer-events: none;
  z-index: 1;
  background:
    linear-gradient(110deg,
      transparent 0%,
      transparent 34%,
      rgba(255,244,202,0.23) 49%,
      transparent 66%,
      transparent 100%);
  transform: translateX(-125%) skewX(-12deg);
  animation: glassLight 3.15s cubic-bezier(.55,.08,.25,1) infinite;
  mix-blend-mode: screen;
  clip-path: inset(0 round 60px);
  -webkit-clip-path: inset(0 round 60px);
}

/* shimmer premium sempre ativo */
.shimmer {
  position: absolute;
  inset: 0;
  border-radius: 60px;
  overflow: hidden;
  z-index: 1;
  opacity: 0.48;
  pointer-events: none;
  clip-path: inset(0 round 60px);
  -webkit-clip-path: inset(0 round 60px);
}

.shimmer::before {
  content: '';
  position: absolute;
  top: -120%;
  left: -85%;
  width: 68%;
  height: 340%;
  background: linear-gradient(
    108deg,
    transparent 24%,
    rgba(240,208,128,0.08) 43%,
    rgba(255,247,210,0.22) 50%,
    rgba(240,208,128,0.08) 57%,
    transparent 74%
  );
  animation: shSweep 2.85s linear infinite;
}

.shimmer::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 60px;
  background: linear-gradient(180deg, rgba(255,255,255,0.035), transparent 55%, rgba(0,0,0,0.055));
  clip-path: inset(0 round 60px);
  -webkit-clip-path: inset(0 round 60px);
}

@keyframes shSweep {
  0%   { transform: translateX(-25%) skewX(-4deg); }
  100% { transform: translateX(325%) skewX(-4deg); }
}

@keyframes glassLight {
  0%   { transform: translateX(-135%) skewX(-12deg); opacity: 0; }
  12%  { opacity: .75; }
  48%  { opacity: .42; }
  78%  { transform: translateX(135%) skewX(-12deg); opacity: 0; }
  100% { transform: translateX(135%) skewX(-12deg); opacity: 0; }
}

@keyframes glassBreath {
  0%, 100% {
    border-color: rgba(240,208,128,0.30);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.14),
      inset 0 -1px 0 rgba(0,0,0,0.15);
  }
  50% {
    border-color: rgba(240,208,128,0.52);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.20),
      inset 0 -1px 0 rgba(0,0,0,0.10);
  }
}

@keyframes glassFloat {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-1px); }
}

/* partículas douradas sutis */
.dust {
  position: absolute;
  inset: 0;
  border-radius: 60px;
  overflow: hidden;
  z-index: 1;
  opacity: 0.42;
  pointer-events: none;
}

.dust i {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(240,212,130,0.72);
  box-shadow: none;
  animation: dustFloat 3s ease-in-out infinite;
}

.dust i:nth-child(1){left:10%;bottom:22%;animation-duration:2.5s;}
.dust i:nth-child(2){left:22%;bottom:32%;animation-delay:.35s;animation-duration:3.2s;width:2px;height:2px;}
.dust i:nth-child(3){left:40%;bottom:18%;animation-delay:.7s;animation-duration:2.8s;}
.dust i:nth-child(4){left:58%;bottom:28%;animation-delay:1.1s;animation-duration:3.5s;width:2px;height:2px;}
.dust i:nth-child(5){left:74%;bottom:20%;animation-delay:.25s;animation-duration:2.6s;}
.dust i:nth-child(6){left:88%;bottom:35%;animation-delay:1.5s;animation-duration:3s;width:2px;height:2px;}
.dust i:nth-child(7){left:33%;bottom:42%;animation-delay:.9s;animation-duration:2.9s;width:2px;height:2px;}

@keyframes dustFloat {
  0%,100% { transform: translateY(0) scale(1); opacity: .35; }
  50%      { transform: translateY(-14px) scale(1.38); opacity: .9; }
}

/* anel de brilho infinito */
.glow-ring {
  position: absolute;
  inset: -2px;
  border-radius: 62px;
  pointer-events: none;
  z-index: 0;
  box-shadow: none;
  animation: ringPulse 3.6s ease-in-out infinite;
}

@keyframes ringPulse {
  0%, 100% { opacity: .45; }
  50% { opacity: .8; }
}

/* content */
.btn-inner {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  pointer-events: none;
}

.icon-slot {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.92;
  filter: none;
  transition: opacity 0.25s, transform 0.25s;
}
.icon-slot svg { width: 18px; height: 18px; display: block; }

.lbl {
  flex: 1;
  text-align: center;
  padding-right: 30px;
  text-shadow: none;
}

/* hover states */
.link-btn:hover::before {
  background:
    linear-gradient(135deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.045) 44%, rgba(201,168,76,0.09) 100%),
    rgba(255,255,255,0.052);
  border-color: rgba(240,208,128,0.68);
}
.link-btn:hover .shimmer { opacity: .95; }
.link-btn:hover .dust    { opacity: .65; }
.link-btn:hover { transform: translateY(-3px); color: #faedc8; }
.link-btn:hover .icon-slot { opacity: 1; transform: scale(1.06); }
.link-btn:active { transform: translateY(-1px) scale(0.99); }

@media (prefers-reduced-motion: reduce) {
  .link-btn,
  .link-btn::before,
  .link-btn::after,
  .glow-ring,
  .shimmer::before,
  .dust i,
  .brand-logo,
  .logo-wrap::before,
  .logo-wrap::after,
  .logo-glow {
    animation: none !important;
  }
  .link-btn::after { opacity: .18; transform: none; }
}


/* limpeza anti-quadrados / sombras atrás dos elementos curvados */
.link-btn, .link-btn::before, .link-btn::after, .shimmer, .shimmer::before, .shimmer::after, .dust, .glow-ring {
  border-radius: 999px;
  overflow: hidden;
}

.glow-ring {
  opacity: 0;
}

@supports (-webkit-touch-callout: none) {
  .link-btn::before {
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    background: linear-gradient(135deg, rgba(255,255,255,0.105), rgba(255,255,255,0.035) 48%, rgba(201,168,76,0.075));
  }
}

/* FOOTER */
.footer {
  margin-top: 46px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  opacity: 0;
  animation: fadeIn 0.8s 0.85s ease forwards;
}

.ft-line {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
}

.ft-line::before, .ft-line::after {
  content: '';
  flex: 1;
  height: 1px;
}
.ft-line::before { background: linear-gradient(90deg, transparent, rgba(201,168,76,0.18)); }
.ft-line::after  { background: linear-gradient(90deg, rgba(201,168,76,0.18), transparent); }

.ft-diamond {
  width: 5px; height: 5px;
  background: var(--gold-dim);
  transform: rotate(45deg);
  flex-shrink: 0;
}

.ft-text {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(201,168,76,0.38);
}

.skala-credit {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
  text-align: center;
  line-height: 1.6;
}

.skala-heart {
  color: #ff2f45;
  font-size: 12px;
  line-height: 1;
  filter: drop-shadow(0 0 7px rgba(255,47,69,0.35));
}

.skala-link {
  color: var(--gold-light);
  text-decoration: none;
  font-weight: 700;
  letter-spacing: 0.2em;
  background: linear-gradient(155deg, #fff4c8 0%, #c9a84c 55%, #9a7228 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  transition: opacity 0.25s ease, filter 0.25s ease;
}

.skala-link:hover,
.skala-link:focus-visible {
  opacity: 0.95;
  filter: drop-shadow(0 0 10px rgba(201,168,76,0.45));
  outline: none;
}


/* Ajuste final: logo centralizada pelo conteúdo real da PNG */
.logo-wrap {
  transform: none;
}
.brand-logo {
  object-position: center center;
}
@media (max-width: 520px) {
  .logo-wrap,
  .avatar-wrap.logo-wrap {
    left: 50%;
    transform: translateX(-50%);
    margin-left: 0;
    margin-right: 0;
  }
}

/* KEYFRAMES */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}


@media (max-width: 520px) {
  .avatar-wrap.logo-wrap {
    margin-left: auto;
    margin-right: auto;
    align-self: center;
  }
}

/* RESPONSIVE */
@media (max-width: 390px) {
  .wrapper { padding: 48px 18px 44px; }
  .brand-name { font-size: 28px; }
  .logo-wrap {
    width: 150px;
    height: 156px;
    margin: 0 auto 16px;
    align-self: center;
    left: auto;
    right: auto;
  }
  .brand-logo {
    display: block;
    margin-inline: auto;
    object-position: center center;
  }
  .logo-glow { width: 116px; height: 116px; }
  .avatar-circle { width: 86px; height: 86px; }
  .avatar-letter { font-size: 40px; }
  .link-btn { font-size: 12px; padding: 15px 20px; letter-spacing: 0.14em; }
}


/* FIX iOS/MOBILE: logo sempre visível e centralizada */
.logo-wrap,
.avatar-wrap.logo-wrap {
  position: relative !important;
  left: auto !important;
  right: auto !important;
  transform: none !important;
  width: 176px !important;
  height: auto !important;
  min-height: 184px !important;
  margin: 0 auto 18px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  align-self: center !important;
  opacity: 1 !important;
  visibility: visible !important;
  overflow: visible !important;
  animation: none !important;
}

.logo-wrap::after {
  display: none !important;
  content: none !important;
}

.brand-logo {
  display: block !important;
  width: 176px !important;
  max-width: 176px !important;
  height: auto !important;
  max-height: none !important;
  object-fit: contain !important;
  object-position: center center !important;
  margin: 0 auto !important;
  opacity: 1 !important;
  visibility: visible !important;
  transform: none !important;
  animation: none !important;
  background: transparent !important;
  -webkit-transform: translateZ(0) !important;
  -webkit-backface-visibility: hidden !important;
}

@media (max-width: 520px) {
  .logo-wrap,
  .avatar-wrap.logo-wrap {
    width: 152px !important;
    min-height: 164px !important;
    margin: 0 auto 18px !important;
    left: auto !important;
    transform: none !important;
  }

  .brand-logo {
    width: 152px !important;
    max-width: 152px !important;
  }
}

@media (max-width: 390px) {
  .logo-wrap,
  .avatar-wrap.logo-wrap {
    width: 144px !important;
    min-height: 156px !important;
    margin: 0 auto 16px !important;
    left: auto !important;
    transform: none !important;
  }

  .brand-logo {
    width: 144px !important;
    max-width: 144px !important;
  }
}

</style>
</head>
<body>

<!-- BG CANVAS -->
<div class="bg-scene">
  <canvas id="bgCanvas"></canvas>
  <div class="bg-overlay"></div>
</div>

<!-- PAGE -->
<main class="wrapper">
  <!-- Logo em Base64 SEM FUNDO / PNG transparente -->

<script>
(function(){
  const cv = document.getElementById('bgCanvas');
  const cx = cv.getContext('2d');
  let W, H, pts = [];
  const COLS = [[201,168,76],[240,208,128],[160,118,44],[255,228,130]];

  function rg(a){ const c=COLS[Math.floor(Math.random()*COLS.length)]; return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  function resize(){
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
  }

  function P(init){
    this.reset = function(i){
      this.x  = Math.random()*W;
      this.y  = i ? Math.random()*H : H+8;
      this.r  = Math.random()*1.7+0.3;
      this.vx = (Math.random()-.5)*.38;
      this.vy = -(Math.random()*.5+.18);
      this.al = 0;
      this.ma = Math.random()*.42+.09;
      this.lf = 0;
      this.ml = Math.random()*210+110;
      this.cl = rg(1);
    };
    this.reset(init);
    this.lf = Math.random()*this.ml;

    this.tick = function(){
      this.lf++;
      this.x += this.vx;
      this.y += this.vy;
      const p = this.lf/this.ml;
      if(p<.2)       this.al = this.ma*(p/.2);
      else if(p>.75) this.al = this.ma*((1-p)/.25);
      else           this.al = this.ma;
      if(this.lf>=this.ml) this.reset(false);
    };

    this.draw = function(){
      cx.beginPath();
      cx.arc(this.x,this.y,this.r,0,Math.PI*2);
      cx.fillStyle = this.cl.replace(',1)',`,${this.al.toFixed(3)})`);
      cx.fill();
    };
  }

  resize();
  for(let i=0;i<95;i++) pts.push(new P(true));

  (function loop(){
    cx.clearRect(0,0,W,H);
    pts.forEach(p=>{ p.tick(); p.draw(); });
    requestAnimationFrame(loop);
  })();

  window.addEventListener('resize', resize);
})();
</script>
